services:
  - type: web
    name: jmi-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jmi-db
          property: connectionString
      - key: JMI_SECRET_KEY
        generateValue: true

  - type: web
    name: jmi-web
    runtime: static
    plan: free
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jmi-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: jmi-db
    plan: free
    databaseName: jmi_market
    user: jmi_user
