version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jmi-postgres
    restart: always
    environment:
      POSTGRES_USER: jmi_user
      POSTGRES_PASSWORD: jmi_password
      POSTGRES_DB: jmi_market
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmi_user -d jmi_market"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jmi-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://jmi_user:jmi_password@postgres:5432/jmi_market
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jmi-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
